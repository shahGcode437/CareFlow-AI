# =============================================================================
# CareFlow AI — Clinic Doctor Knowledge Base (Phase 8.8.2)
# =============================================================================
#
# This file is a KNOWLEDGE SOURCE for the Knowledge/RAG Agent
# (Master Spec SYS-02 / UC-02 / FR-003). It is NOT the appointment
# database.
#
# ── Authoritative sources ───────────────────────────────────────────────────
#
# For actual APPOINTMENT AVAILABILITY, doctor activation, and booking
# eligibility, the Appointment Service reads
# `backend/data/clinic_appointments_MVP_template.xlsx`
# (Doctors, Availability, and Appointments sheets). That workbook —
# not this YAML — is the source of truth for whether a doctor can
# actually be booked and when.
#
# The `available_days_summary` field below is INFORMATIONAL PROSE for
# the Knowledge Agent's spoken answers. The Knowledge Agent MUST NOT
# be used to answer "is this slot free right now" questions —
# availability is the Appointment Agent's job.
#
# ── Consistency ─────────────────────────────────────────────────────────────
#
# DOC-001 and DOC-002 are the two doctors that exist in the workbook
# today. Their id, name, specialty, and available-day/time summary
# below MUST stay consistent with the workbook so the two sides of
# the system tell the same story about the same doctor.
#
# All other doctors (DOC-003 through DOC-012) are DEMO-ONLY profiles
# — they are NOT present in the workbook and therefore CANNOT be
# booked through the appointment system today (a booking attempt
# will honestly fail with DOCTOR_NOT_FOUND). Every DEMO entry is
# marked with `demo_only: true`.
#
# ── Format ─────────────────────────────────────────────────────────────────
#
# One document per doctor. Every entry MUST contain every listed
# field so the chunker can render uniform text. Fees are in PKR
# (Pakistani rupees) and are demonstrative.
# =============================================================================

